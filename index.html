<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ancestral Faces — animal masks of the world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ECE6DA;
    font-family:'Inter Tight',system-ui,sans-serif;color:#2b231d;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #stage{touch-action:none;cursor:grab}
  #stage.grab{cursor:grabbing}

  /* Верх: название и звук */
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:22px 4vw;z-index:3;pointer-events:none}
  .brand{font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
  .tbtn{pointer-events:auto;background:none;border:0;font:600 12px 'Inter Tight',sans-serif;letter-spacing:.14em;
    text-transform:uppercase;color:inherit;cursor:pointer;padding:8px 4px;opacity:.55;transition:opacity .25s}
  .tbtn:hover,.tbtn.on{opacity:1}
  button:focus-visible{outline:2px solid #8A3B2E;outline-offset:3px}

  /* Переход между странами — слева и справа */
  .side{position:fixed;top:36vh;transform:translateY(-50%);z-index:3;background:none;border:0;cursor:pointer;
    color:#2b231d;padding:12px 4px;display:flex;flex-direction:column;gap:4px;opacity:.5;transition:opacity .3s,transform .3s}
  .side:hover{opacity:1}
  #prev{left:4vw;align-items:flex-start}
  #next{right:4vw;align-items:flex-end}
  #prev:hover{transform:translateY(-50%) translateX(-4px)}
  #next:hover{transform:translateY(-50%) translateX(4px)}
  #prev b::before{content:'← '} #next b::after{content:' →'}
  .side b{font:400 clamp(24px,2.3vw,38px)/1 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;display:inline-block;transition:opacity .45s ease,transform .45s ease,filter .45s ease}
  .side.swap b{opacity:0;filter:blur(4px)}
  #prev.swap b{transform:translateX(-14px)} #next.swap b{transform:translateX(14px)}

  /* Вступление под названием */
  #lead{position:fixed;left:50%;top:18px;transform:translateX(-50%);width:min(23vw,360px);margin:0;z-index:2;text-align:center;
    font-weight:500;font-size:14px;line-height:1.35;letter-spacing:-.005em;color:rgba(43,35,29,.66);pointer-events:none}
  /* Текст прямо на фоне */
  #head{position:fixed;left:4vw;bottom:7vh;width:27vw;z-index:2;pointer-events:none}
  #h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(32px,3.2vw,56px);
    line-height:1;letter-spacing:.005em;text-transform:uppercase;margin:0;color:rgba(43,35,29,.42)}
  #h1 .cty{color:#2b231d}
  .w{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(5px);
    transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1),filter .8s ease}
  #head.show .w{opacity:1;transform:none;filter:none}
  #info{position:fixed;right:4vw;bottom:7vh;width:24vw;max-width:400px;z-index:2}
  #info .blk{opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease}
  #info.show .blk{opacity:1;transform:none}
  #info .txt{margin:0;font-weight:600;font-size:clamp(15px,1.15vw,18px);line-height:1.14;letter-spacing:-.018em;color:rgba(43,35,29,.5)}
  #info .try{margin:14px 0 0;font-weight:600;font-size:13px;line-height:1.3;color:#2b231d}
  #info .src{margin:12px 0 0;font-size:11.5px;line-height:1.45;color:rgba(43,35,29,.5)}
  #info .src summary{cursor:pointer;list-style:none;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;opacity:.7;width:max-content}
  #info .src summary::-webkit-details-marker{display:none}
  #info .src summary::after{content:' +'}
  #info .src[open] summary::after{content:' −'}
  #info .src p{margin:6px 0 0}
  #info a{color:inherit;text-underline-offset:2px}
  #info .note{margin:6px 0 0;font-size:11px;line-height:1.4;color:rgba(43,35,29,.42)}
  .fast .w,.fast .blk{transition-duration:.25s!important;transition-delay:0s!important}
  #panelSet{position:fixed;top:64px;right:4vw;width:250px;z-index:4;background:rgba(244,239,229,.86);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:16px 18px;
    box-shadow:0 10px 30px rgba(40,25,10,.12);display:flex;flex-direction:column;gap:10px}
  #panelSet[hidden]{display:none}
  #panelSet label{display:flex;flex-direction:column;gap:4px;font:600 11px 'Inter Tight',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(43,35,29,.7)}
  #panelSet input[type=range]{width:100%;accent-color:#2b231d}
  .pbtn{border:0;border-radius:999px;background:#2b231d;color:#f4efe6;font:600 12px 'Inter Tight',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;cursor:pointer}
  .pbtn.ghost{background:none;color:#2b231d;opacity:.6;padding:4px}
  @media (max-width:899px){ #panelSet{top:52px;right:12px;left:12px;width:auto} }
  #fps{position:fixed;left:18px;bottom:18px;font:12px monospace;background:#0008;color:#fff;padding:4px 6px;border-radius:4px;display:none;z-index:5}

  /* Телефон: маска сверху, текст снизу и прокручивается */
  @media (max-width:899px){
    .top{padding:14px 18px}
    .brand{font-size:18px}
    .side{top:calc(56vh - 34px);transform:none;padding:6px 2px}
    #prev{left:16px} #next{right:16px}
    #prev:hover,#next:hover{transform:none}
    .side b{font-size:17px}
    #tw{position:fixed;top:57vh;left:0;right:0;bottom:0;overflow:auto;padding:6px 22px 34px;z-index:2}
    #head,#info,#lead{position:static;width:auto;max-width:none}
    #lead{margin:0 0 12px;font-size:14px;transform:none;text-align:left}
    #h1{font-size:30px}
    #info{margin-top:14px}
    #info .txt{font-size:16px;line-height:1.2}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="stage"></canvas>

<div class="top">
  <div class="brand">Ancestral Faces</div>
  <button class="tbtn" id="sound" aria-label="Sound and settings" aria-expanded="false">Sound · off ▾</button>
</div>
<button class="side" id="prev" aria-label="Previous mask"><b id="prevName"></b></button>
<button class="side" id="next" aria-label="Next mask"><b id="nextName"></b></button>

<div id="panelSet" hidden>
  <button id="sOn" class="pbtn">Turn sound on</button>
  <label>Volume<input type="range" id="sVol" min="0" max="1" step=".01"></label>
  <label>Echo<input type="range" id="sEcho" min="0" max="1" step=".01"></label>
  <label>Length<input type="range" id="sLen" min=".5" max="1.6" step=".05"></label>
  <label>Density<input type="range" id="sDens" min="3" max="16" step="1"></label>
  <label>Decor<input type="range" id="sDecor" min="0" max="4" step="1"></label>
  <label>Breeze<input type="range" id="sWind" min="0" max="3" step=".1"></label>
  <label>Sensitivity<input type="range" id="sSens" min=".4" max="3" step=".1"></label>
  <button id="sReset" class="pbtn ghost">Reset</button>
</div>
<div id="tw">
  <p id="lead">From the Balkans to Bali, some of the world’s oldest rituals are still danced in animal masks. Each mask is the face of its culture.</p>
  <div id="head"><h1 id="h1"></h1></div>
  <div id="info"></div>
</div>
<div id="fps"></div>

<script>
'use strict';
/* =========================================================
   «Звериный лик» — макет. Вся графика нарисована кодом.
   Слои: плетёный фон → тень → задние висюльки → маска →
   передние висюльки → текст → кнопки.
   ========================================================= */

// ---------- Утилиты ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
function rng(seed) { // воспроизводимый случайный генератор
  return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shade(hex, k) { // k>0 — светлее, k<0 — темнее
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (k > 0) { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; } else { r *= 1 + k; g *= 1 + k; b *= 1 + k; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function bez(p0, p1, p2, p3, n) { // точки кривой Безье
  const o = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t;
    o.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]); }
  return o;
}
function taper(ctx, pts, w0, w1) { // сужающаяся «лента» вдоль точек
  const L = [], R = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = lerp(w0, w1, i / (pts.length - 1)) / 2;
    L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); R.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]); for (const p of L) ctx.lineTo(p[0], p[1]);
  for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]); ctx.closePath();
}
function ridges(ctx, pts, w0, w1, step, col) { // кольца поперёк рога
  ctx.strokeStyle = col; ctx.lineWidth = 1.6;
  for (let i = 2; i < pts.length - 3; i += step) {
    const a = pts[i], b = pts[i + 1]; let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = lerp(w0, w1, i / (pts.length - 1)) / 2 * .92;
    ctx.beginPath(); ctx.moveTo(a[0] - dy * w, a[1] + dx * w);
    ctx.quadraticCurveTo(a[0] + dx * 5, a[1] + dy * 5, a[0] + dy * w, a[1] - dx * w); ctx.stroke();
  }
}
function fur(ctx, r, x0, y0, x1, y1, n, cols, len, dir) { // штрихи меха внутри текущей обрезки
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, r()), y = lerp(y0, y1, r());
    const a = dir ? dir(x, y) : Math.PI / 2, l = len * (.6 + r() * .8), bend = (r() - .5) * l * .5;
    ctx.strokeStyle = cols[(r() * cols.length) | 0]; ctx.lineWidth = .8 + r() * 1.6; ctx.globalAlpha = .3 + r() * .55;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(a) * l * .5 - Math.sin(a) * bend, y + Math.sin(a) * l * .5 + Math.cos(a) * bend, x + Math.cos(a) * l, y + Math.sin(a) * l);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function mirrorDisc(ctx, x, y, r) { // зеркальце
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, 1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.5, '#DDE6EA'); g.addColorStop(1, '#8c9aa0');
  ctx.fillStyle = '#5a4630'; ell(ctx, x, y, r + 2.5, r + 2.5); ctx.fill();
  ctx.fillStyle = g; ell(ctx, x, y, r, r); ctx.fill();
}

// ---------- Колокол, лента и прочие висюльки ----------
function drawBell(ctx, x, y, ang, r, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang - Math.PI / 2);
  const g = ctx.createLinearGradient(-r, 0, r, 0);
  g.addColorStop(0, shade(col, -.5)); g.addColorStop(.3, shade(col, .4)); g.addColorStop(.55, col); g.addColorStop(1, shade(col, -.6));
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-r * .32, -r * .1);
  ctx.bezierCurveTo(-r * .55, r * .6, -r * .72, r * 1.05, -r, r * 1.42); ctx.lineTo(r, r * 1.42);
  ctx.bezierCurveTo(r * .72, r * 1.05, r * .55, r * .6, r * .32, -r * .1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(col, -.65); ctx.lineWidth = Math.max(1, r * .06); ctx.stroke();
  ctx.fillStyle = shade(col, -.45); ell(ctx, 0, r * 1.42, r, r * .2); ctx.fill();
  ctx.fillStyle = '#1e1610'; ell(ctx, 0, r * 1.5, r * .17, r * .17); ctx.fill();
  ctx.fillStyle = shade(col, -.3); ell(ctx, 0, -r * .12, r * .34, r * .12); ctx.fill();
  ctx.restore();
}
function smoothLine(ctx, p) { // плавная линия через точки
  ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
  for (let i = 1; i < p.length - 1; i++) { const mx = (p[i].x + p[i + 1].x) / 2, my = (p[i].y + p[i + 1].y) / 2; ctx.quadraticCurveTo(p[i].x, p[i].y, mx, my); }
  ctx.lineTo(p[p.length - 1].x, p[p.length - 1].y);
}
function drawRibbon(ctx, p, w, col) { // лента с перекрутом
  const L = [], R = [], back = [];
  for (let i = 0; i < p.length; i++) {
    const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
    let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const tw = Math.cos(i * .5 + Math.atan2(dy, dx) * 2.2); const ww = w * (.3 + .7 * Math.abs(tw)) / 2;
    L.push([p[i].x - dy * ww, p[i].y + dx * ww]); R.push([p[i].x + dy * ww, p[i].y - dx * ww]); back.push(tw < 0);
  }
  const dark = shade(col, -.3);
  for (let i = 0; i < p.length - 1; i++) {
    ctx.fillStyle = back[i] ? dark : col;
    ctx.beginPath(); ctx.moveTo(L[i][0], L[i][1]); ctx.lineTo(L[i + 1][0], L[i + 1][1]);
    ctx.lineTo(R[i + 1][0], R[i + 1][1]); ctx.lineTo(R[i][0], R[i][1]); ctx.closePath(); ctx.fill();
  }
  // хвостик ленты — «ласточкин хвост»
  const e = p[p.length - 1], f = p[p.length - 2]; const ang = Math.atan2(e.y - f.y, e.x - f.x);
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(ang); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, -w * .45); ctx.lineTo(w * .9, -w * .5); ctx.lineTo(w * .45, 0); ctx.lineTo(w * .9, w * .5); ctx.lineTo(0, w * .45); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------- Фон: шершавая льняная бумага ----------
function paper(cv) {
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, r = rng(77), k = BDPR;
  ctx.fillStyle = '#ECE6DA'; ctx.fillRect(0, 0, W, H);
  // мягкие пятна неровности
  for (let i = 0; i < 46; i++) { const x = r() * W, y = r() * H, rr = (90 + r() * 280) * k, g = ctx.createRadialGradient(x, y, 0, x, y, rr), l = r() < .5;
    g.addColorStop(0, l ? 'rgba(255,253,248,.12)' : 'rgba(130,110,80,.045)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
  // нити полотна — горизонтальные и вертикальные
  ctx.lineWidth = k * .9; const st = 2.7 * k;
  for (const dir of [0, 1]) for (let q = 0; q < (dir ? W : H); q += st) {
    ctx.strokeStyle = r() < .5 ? `rgba(255,253,248,${.10 + r() * .14})` : `rgba(120,100,70,${.035 + r() * .05})`;
    ctx.beginPath(); let t = 0; const len = dir ? H : W;
    while (t < len) { const L = (18 + r() * 110) * k, j = (r() - .5) * .7 * k;
      if (dir) { ctx.moveTo(q + j, t); ctx.lineTo(q + j, t + L); } else { ctx.moveTo(t, q + j); ctx.lineTo(t + L, q + j); } t += L + r() * 7 * k; }
    ctx.stroke();
  }
  // зерно бумаги
  const id = ctx.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 11; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(id, 0, 0);
  // лёгкая виньетка
  const v = ctx.createRadialGradient(W * .5, H * .45, Math.min(W, H) * .3, W * .5, H * .5, Math.hypot(W, H) * .62);
  v.addColorStop(0, 'rgba(60,40,20,0)'); v.addColorStop(1, 'rgba(60,40,20,.08)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ---------- Рамка рисования маски (местные координаты) ----------
const BOX = { x0: -280, y0: -380, w: 560, h: 740 };

/* ================= МАСКА 1: КОЗА — картинка из Higgsfield ================= */
// картинки масок из Higgsfield (лежат рядом с index.html)
const IMGS = {}; for (const k of ['goat', 'kuker', 'barong', 'kitsune']) { IMGS[k] = new Image(); IMGS[k].src = k + '.webp'; }
// блестящие места на картинках: доли ширины/высоты и радиус (доля высоты)
const SHINE = {
  kuker: [[.400, .275, .022], [.505, .261, .028], [.608, .275, .022], [.314, .405, .022], [.505, .392, .03], [.689, .405, .022]],
  barong: [[.500, .070, .02], [.373, .111, .014], [.627, .114, .014], [.277, .159, .016], [.492, .166, .025], [.726, .159, .016],
    [.164, .236, .014], [.334, .244, .018], [.667, .244, .018], [.839, .236, .014], [.113, .320, .016], [.891, .320, .016], [.175, .500, .019], [.833, .500, .019]],
  kitsune: [[.500, .45, .05], [.244, .584, .028], [.759, .584, .028]],
};
function fitImg(img) { // вписываем картинку в рамку маски: не выше 700 и не шире 540
  let h = 700, w = h * img.naturalWidth / img.naturalHeight; if (w > 540) { w = 540; h = w * img.naturalHeight / img.naturalWidth; }
  return { w, h, x: -w / 2, y: -10 - h / 2 };
}
function imgDrawer(key) {
  return function (ctx) { const img = IMGS[key]; if (!img.naturalWidth) return; const f = fitImg(img);
    ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, f.x, f.y, f.w, f.h);
    const m = MASKS.find(q => q.key === key); if (SHINE[key]) m.mirrors = SHINE[key].map(([fx, fy, fr]) => [f.x + fx * f.w, f.y + fy * f.h, fr * f.h]); };
}
const drawGoatImg = imgDrawer('goat');
/* старый рисунок козы кодом (не используется) */
function drawGoat(ctx) {
  const r = rng(11);
  // рога
  for (const s of [-1, 1]) {
    ctx.save(); ctx.scale(s, 1);
    const pts = bez([32, -150], [40, -270], [150, -335], [178, -232], 40);
    const g = ctx.createLinearGradient(30, -330, 180, -150); g.addColorStop(0, '#F3EAD3'); g.addColorStop(1, '#B9A57C');
    ctx.fillStyle = g; taper(ctx, pts, 48, 7); ctx.fill(); ctx.strokeStyle = '#7f6d4b'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); taper(ctx, pts, 48, 7); ctx.clip(); ridges(ctx, pts, 48, 7, 2, 'rgba(110,90,60,.5)'); ctx.restore();
    ctx.restore();
  }
  // уши
  for (const s of [-1, 1]) {
    ctx.save(); ctx.scale(s, 1); ctx.translate(98, -112); ctx.rotate(.35);
    ctx.fillStyle = '#4e3524'; ell(ctx, 42, 0, 60, 23); ctx.fill();
    ctx.save(); ell(ctx, 42, 0, 60, 23); ctx.clip(); fur(ctx, r, -10, -25, 100, 25, 120, ['#2e1f15', '#6b4a32', '#8a6448'], 10, () => 0); ctx.restore();
    ctx.fillStyle = '#b98571'; ell(ctx, 46, 3, 44, 11); ctx.fill();
    ctx.fillStyle = 'rgba(120,60,50,.35)'; ell(ctx, 46, 5, 36, 6); ctx.fill();
    ctx.restore();
  }

// ---------- Действия ----------
function shake(power = 1) {

function clickMask() {

function go(i) {

const headEl = document.getElementById('head'), infoEl = document.getElementById('info');
function hideText() { headEl.classList.add('fast'); infoEl.classList.add('fast'); headEl.classList.remove('show'); infoEl.classList.remove('show'); }
function setText() { // текст проявляется постепенно: сначала слова фразы, потом подробности
  const m = MASKS[cur];

  const words = [`<span class="cty">${m.country}</span>`, '—', ...m.head.split(' ')];

  infoEl.scrollTop = 0; document.getElementById('tw').scrollTop = 0;

// ---------- Обновление ----------
function update(dt) {

  const k = 1 - Math.exp(-dt * 5);

      st.enterY = SH * .2; resetChains(MASKS[cur], true); bgA = -(bgMax + 90); buildBgChains(); bgA = -(bgMax + 90); bgMode = 'down'; bgT = 0; warmSounds(); setText(); } }
  else if (phase === 'in') { pt += dt / .6; st.enterY = (1 - easeOut(Math.min(pt, 1))) * SH * .2; st.alpha = Math.min(pt * 1.4, 1); if (pt >= 1) { phase = 'idle'; st.enterY = 0; st.alpha = 1; } }

// ---------- Отрисовка ----------
function drawChain(ctx, c) {
  const d = c.d, p = c.pts, w = (d.w || 2) * S;

}
function render() {

  ctx.globalAlpha = 1; drawBg(ctx); ctx.globalAlpha = st.alpha;

  ctx.save(); ctx.globalAlpha = st.alpha; ctx.translate(o.x, o.y); ctx.rotate(a);

function drawRavenPanels(ctx, m) { // створки поворачиваются на петлях у краёв

// ---------- Ввод: мышь, касание, клавиши ----------
function inStage(x, y) { return mobile ? y < SY + SH : true; }

addEventListener('pointermove', e => {

stC.addEventListener('pointerdown', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.in = inStage(ptr.x, ptr.y); ptr.t = performance.now(); ptr.vx = ptr.vy = 0;

// ---------- Кнопки ----------

document.getElementById('next').onclick = () => go(cur + 1);
const sBtn = document.getElementById('sound'), pnl = document.getElementById('panelSet'), sOn = document.getElementById('sOn');
function soundLabel() { sBtn.textContent = (soundOn ? 'Sound · on' : 'Sound · off') + (pnl.hidden ? ' ▾' : ' ▴'); sBtn.classList.toggle('on', soundOn);
  sOn.textContent = soundOn ? 'Turn sound off' : 'Turn sound on'; }
sBtn.onclick = () => { pnl.hidden = !pnl.hidden; sBtn.setAttribute('aria-expanded', !pnl.hidden); soundLabel(); };
sOn.onclick = async () => {
  if (!AC) initAudio(); if (AC.state === 'suspended') AC.resume();
  soundOn = !soundOn; soundLabel(); warmSounds();
  if (soundOn) playInst(BGD[MASKS[cur].key].inst, BGD[MASKS[cur].key].scale[4] && NT(BGD[MASKS[cur].key].scale[4]), .6);

};
const SL = { sVol: 'vol', sEcho: 'echo', sLen: 'len', sDens: 'dens', sDecor: 'decor', sWind: 'wind', sSens: 'sens' };
function syncSliders() { for (const id in SL) document.getElementById(id).value = SET[SL[id]]; }
for (const id in SL) {
  const el = document.getElementById(id), k = SL[id];
  el.addEventListener('input', () => { SET[k] = +el.value; saveSet();
    if (k === 'vol' && master) master.gain.value = SET.vol;
    if (k === 'echo' && wet) wet.gain.value = SET.echo * .9; });
  // длина, густота и декор пересобирают висюльки, когда отпустили ползунок

}
document.getElementById('sReset').onclick = () => { Object.assign(SET, { vol: .7, len: 1, dens: 9, decor: 2, wind: 1, echo: .35, sens: 1 }); saveSet(); syncSliders();
  if (master) master.gain.value = SET.vol; if (wet) wet.gain.value = SET.echo * .9; buildBgChains(); };
syncSliders();

// ---------- Счётчик кадров (для проверки: ?debug) ----------
const dbg = /debug/.test(location.search), fpsEl = document.getElementById('fps'); if (dbg) fpsEl.style.display = 'block';
let fN = 0, fT = 0; window.__fps = 0; window.__plucks = () => plucks;

// ---------- Запуск ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt;
  let n = 0; while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; } if (n === 6) acc = 0;
